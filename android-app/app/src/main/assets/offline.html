<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — BUEA ONLINE SHOP</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; }
    body {
      font-family:'Segoe UI', Arial, sans-serif;
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:linear-gradient(160deg,#071F55,#0B3FA8 55%,#168BFF);
      color:#fff; text-align:center; padding:24px;
    }
    .box { max-width:360px; width:100%; }
    .logo {
      width:84px; height:84px; margin:0 auto 20px; background:#fff; border-radius:20px;
      display:flex; align-items:center; justify-content:center;
      font-weight:900; font-size:44px; color:#FF7A00; box-shadow:0 10px 30px rgba(0,0,0,.25);
    }
    h1 { font-size:22px; margin-bottom:10px; letter-spacing:1px; }
    p { font-size:14px; color:#d3def5; line-height:1.6; margin-bottom:24px; }
    .status { display:flex; align-items:center; justify-content:center; gap:8px; font-size:12px; color:#cfe0ff; margin-bottom:20px; }
    .dot { width:8px; height:8px; border-radius:50%; background:#FF7A00; animation:pulse 1.4s infinite; }
    @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }
    .brand { margin-top:28px; font-size:11px; letter-spacing:2px; color:#a9bce4; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">B</div>
    <h1>Vous êtes hors ligne</h1>
    <p>BUEA ONLINE SHOP a besoin d'une connexion pour charger les derniers articles.<br />Vérifiez votre connexion, l'application se reconnectera automatiquement.</p>
    <div class="status"><span class="dot"></span> En attente de connexion…</div>
    <div class="brand">BUEA ONLINE SHOP — SHOP LOCAL, DELIVERING THE BEST</div>
  </div>
</body>
</html>
