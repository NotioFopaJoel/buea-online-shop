<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're offline — BUEA ONLINE SHOP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #071F55, #0B3FA8 55%, #168BFF);
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .box { max-width: 400px; width: 100%; }
    .logo {
      width: 84px; height: 84px; margin: 0 auto 20px;
      background: #fff; border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 42px; color: #FF7A00;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    h1 { font-size: 22px; margin-bottom: 10px; letter-spacing: 1px; }
    p { font-size: 14px; color: #d3def5; line-height: 1.6; margin-bottom: 24px; }
    .btn {
      display: inline-block; padding: 12px 32px; border-radius: 12px;
      background: #fff; color: #071F55; font-weight: 700; text-decoration: none;
    }
    .brand { margin-top: 28px; font-size: 11px; letter-spacing: 2px; color: #a9bce4; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">B</div>
    <h1>You're offline</h1>
    <p>BUEA ONLINE SHOP needs a connection to load the latest products.<br />Check your internet and try again.</p>
    <a class="btn" href="/" onclick="location.reload()">Reconnect</a>
    <div class="brand">BUEA ONLINE SHOP — SHOP LOCAL, DELIVERING THE BEST</div>
  </div>
</body>
</html>
